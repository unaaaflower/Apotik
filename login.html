<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk — SehatKita</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <main class="auth-panel">
            <a href="login.html" class="logo logo-standalone">
                <span class="logo-mark">
                    <svg viewBox="0 0 24 24" width="26" height="26" fill="none">
                        <path d="M12 2 L14 8 L20 8 L14.5 12 L16.5 19 L12 15 L7.5 19 L9.5 12 L4 8 L10 8 Z" fill="#FFD85A" />
                    </svg>
                </span>
                <span class="logo-text logo-text-dark">SehatKita<br><small>Apotek Online</small></span>
            </a>

            <div class="auth-card">

                <div class="tabs" data-active="login" role="tablist" aria-label="Pilih Masuk atau Daftar">
                    <a class="tab is-active" href="login.html" role="tab" aria-selected="true">Masuk</a>
                    <a class="tab" href="register.html" role="tab" aria-selected="false">Daftar</a>
                    <span class="tab-indicator" aria-hidden="true"></span>
                </div>

                <form class="auth-form is-active" id="panel-login" novalidate>

                    <h2>Selamat datang kembali</h2>
                    <p class="auth-sub">Masuk untuk melanjutkan belanja kebutuhan kesehatanmu.</p>

                    <div class="field">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" name="email" placeholder="nama@email.com"
                            autocomplete="username" required>
                        <span class="field-error" data-error-for="login-email"></span>
                    </div>

                    <div class="field">
                        <label for="login-password">Kata sandi</label>
                        <div class="password-wrap">
                            <input type="password" id="login-password" name="password" placeholder="Masukkan kata sandi"
                                autocomplete="current-password" required minlength="8">
                            <button type="button" class="toggle-pass" data-target="login-password"
                                aria-label="Tampilkan kata sandi">
                                <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18">
                                    <path d="M12 5c-5 0-9 4-10.5 7C3 15 7 19 12 19s9-4 10.5-7C21 9 17 5 12 5Z"
                                        fill="none" stroke="currentColor" stroke-width="1.6" />
                                    <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor"
                                        stroke-width="1.6" />
                                </svg>
                            </button>
                        </div>
                        <span class="field-error" data-error-for="login-password"></span>
                    </div>

                    <div class="row-between">
                        <label class="checkbox">
                            <input type="checkbox" name="remember">
                            <span>Ingat saya</span>
                        </label>
                        <a href="#" class="link-muted">Lupa kata sandi?</a>
                    </div>

                    <button type="submit" class="btn-primary">Masuk</button>

                    <div class="form-message" id="login-message" role="status" aria-live="polite"></div>

                    <div class="divider"><span>atau lanjutkan dengan</span></div>

                    <div class="social-row">
                        <button type="button" class="btn-social">
                            <svg width="18" height="18" viewBox="0 0 18 18">
                                <path fill="#4285F4"
                                    d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.56 2.7-3.86 2.7-6.62Z" />
                                <path fill="#34A853"
                                    d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18Z" />
                                <path fill="#FBBC05"
                                    d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.16.28-1.7V4.97H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.03l2.97-2.33Z" />
                                <path fill="#EA4335"
                                    d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.9 11.42 0 9 0A9 9 0 0 0 .98 4.97l2.97 2.33C4.66 5.17 6.65 3.58 9 3.58Z" />
                            </svg>
                            Google
                        </button>
                        <button type="button" class="btn-social">
                            <svg width="18" height="18" viewBox="0 0 18 18">
                                <path fill="#1877F2"
                                    d="M18 9a9 9 0 1 0-10.4 8.9v-6.3H5.3V9h2.3V7c0-2.27 1.35-3.53 3.42-3.53.99 0 2.03.18 2.03.18v2.24h-1.14c-1.13 0-1.48.7-1.48 1.42V9h2.52l-.4 2.6h-2.12v6.3A9 9 0 0 0 18 9Z" />
                            </svg>
                            Facebook
                        </button>
                    </div>

                    <p class="switch-text">Belum punya akun? <a href="register.html" class="link-strong">Daftar sekarang</a></p>
                </form>

            </div>
        </main>

    </div>

    <script src="auth.js"></script>
</body>

</html>
