<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar — SehatKita</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <main class="auth-panel">
            <a href="login.html" class="logo logo-standalone">
                <span class="logo-mark">
                    <svg viewBox="0 0 24 24" width="26" height="26" fill="none">
                        <path d="M12 2 L14 8 L20 8 L14.5 12 L16.5 19 L12 15 L7.5 19 L9.5 12 L4 8 L10 8 Z" fill="#FFD85A" />
                    </svg>
                </span>
                <span class="logo-text logo-text-dark">SehatKita<br><small>Apotek Online</small></span>
            </a>

            <div class="auth-card">

                <div class="tabs" data-active="register" role="tablist" aria-label="Pilih Masuk atau Daftar">
                    <a class="tab" href="login.html" role="tab" aria-selected="false">Masuk</a>
                    <a class="tab is-active" href="register.html" role="tab" aria-selected="true">Daftar</a>
                    <span class="tab-indicator" aria-hidden="true"></span>
                </div>

                <form class="auth-form is-active" id="panel-register" novalidate>
                    <h2>Buat akun baru</h2>
                    <p class="auth-sub">Gratis, cepat, dan siap kelola kebutuhan kesehatanmu.</p>

                    <div class="field">
                        <label for="reg-name">Nama lengkap</label>
                        <input type="text" id="reg-name" name="name" placeholder="Nama sesuai KTP" autocomplete="name"
                            required minlength="3">
                        <span class="field-error" data-error-for="reg-name"></span>
                    </div>

                    <div class="field">
                        <label for="reg-email">Email</label>
                        <input type="email" id="reg-email" name="email" placeholder="nama@email.com"
                            autocomplete="email" required>
                        <span class="field-error" data-error-for="reg-email"></span>
                    </div>

                    <div class="field">
                        <label for="reg-phone">No. HP</label>
                        <input type="tel" id="reg-phone" name="phone" placeholder="0812 3456 7890" autocomplete="tel"
                            required pattern="[0-9+\s-]{9,15}">
                        <span class="field-error" data-error-for="reg-phone"></span>
                    </div>

                    <div class="field">
                        <label for="reg-password">Kata sandi</label>
                        <div class="password-wrap">
                            <input type="password" id="reg-password" name="password" placeholder="Minimal 8 karakter"
                                autocomplete="new-password" required minlength="8">
                            <button type="button" class="toggle-pass" data-target="reg-password"
                                aria-label="Tampilkan kata sandi">
                                <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18">
                                    <path d="M12 5c-5 0-9 4-10.5 7C3 15 7 19 12 19s9-4 10.5-7C21 9 17 5 12 5Z"
                                        fill="none" stroke="currentColor" stroke-width="1.6" />
                                    <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor"
                                        stroke-width="1.6" />
                                </svg>
                            </button>
                        </div>
                        <div class="strength-meter" aria-hidden="true">
                            <span></span><span></span><span></span><span></span>
                        </div>
                        <span class="field-hint" id="reg-password-hint">Gunakan kombinasi huruf, angka, dan
                            simbol</span>
                        <span class="field-error" data-error-for="reg-password"></span>
                    </div>

                    <div class="field">
                        <label for="reg-confirm">Konfirmasi kata sandi</label>
                        <input type="password" id="reg-confirm" name="confirm" placeholder="Ulangi kata sandi"
                            autocomplete="new-password" required minlength="8">
                        <span class="field-error" data-error-for="reg-confirm"></span>
                    </div>

                    <label class="checkbox terms">
                        <input type="checkbox" name="terms" id="reg-terms" required>
                        <span>Saya menyetujui <a href="#" class="link-strong">Syarat &amp; Ketentuan</a> dan <a href="#"
                                class="link-strong">Kebijakan Privasi</a></span>
                    </label>
                    <span class="field-error" data-error-for="reg-terms"></span>

                    <button type="submit" class="btn-primary">Daftar</button>

                    <div class="form-message" id="register-message" role="status" aria-live="polite"></div>

                    <p class="switch-text">Sudah punya akun? <a href="login.html" class="link-strong">Masuk di sini</a></p>
                </form>

            </div>
        </main>

    </div>

    <script src="auth.js"></script>
</body>

</html>
